# AMAT v11: expanded adaptive daily research candidate.
#
# This is v10's same 124-symbol tradable universe (from the 128-symbol snapshot)
# with selection, soft market-
# structure quality, trailing signal-payoff risk budgeting, and causal learned
# regime conditioning enabled. It is the executable DAILY precursor to the
# requested multi-horizon strategy. True shorts and hourly/intraday sleeves are
# not claimed here: the current ledger prohibits negative inventory and the
# snapshot contains neither hourly bars nor a 15:55 execution window.

name = "amat-adaptive-defense-energy-124"
version = "11.0.3"

[[universe.clusters]]
name = "us_equity_broad"
gross_cap = 0.40
symbols = ["SPY", "VTI", "QQQ", "IWM", "IJH", "IJR", "MDY", "RSP"]

