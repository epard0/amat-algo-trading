# AMAT v7-wide81: the frozen v1 core over the wide snapshot's usable symbols.
#
# REGISTERED EXPERIMENT 0006, arm B92 — RUN AS B81. This is a DOCUMENTED
# DEVIATION from the registration, recorded as one rather than presented as the
# registered arm.
#
# WHY 81 AND NOT 92. Two mechanical exclusion rules, both reading DATA QUALITY
# and never returns, applied to the snapshot as built:
#
# 1. AMBIGUOUS DISTRIBUTIONS (8 symbols: BND, BNDX, EWT, IWF, MTUM, TLH, VCIT,
#    VCSH). The snapshot records 18 corporate actions with conflicting values on
#    one ex-date across these symbols. Twelve fall in December, which is the
#    signature of an income distribution and a year-end capital-gains
#    distribution booked to the same ex-date -- in which case summing is
#    correct. But that is a hypothesis about vendor bookkeeping, not evidence
#    about any particular record, and the registry is explicit that the loader
#    must not be relaxed to sum. Eighteen distributions cannot be resolved to
#    the standard the SHY entry met (eleven years of pattern evidence for one
#    record), so they are not resolved and their symbols are dropped. SHY is
#    RETAINED because its single conflict does carry such an entry.
#
# 2. INCOMPLETE COVERAGE (3 symbols: JNK, SLX, GDXJ). The inclusion probe that
#    built the 92-symbol list tested the RAW daily pull only. `_build_daily_frame`
#    inner-joins the raw and adjusted pulls and drops any cell present in just
#    one, because a key in only one pull means the vendor's view changed between
#    them. JNK survives that join only from 2019-05-06, and `load_panel`
#    intersects, so leaving it in truncated the whole panel from 2,665 sessions
#    to 1,826 and made the arm incomparable to every other. SLX and GDXJ lose
#    2016 Q1 the same way.
#
# THE BIAS THIS INTRODUCES, STATED PLAINLY. Both rules are mechanical, but they
# are applied after seeing which symbols fail, and the excluded set is mostly
# bond funds -- which underperformed over 2016-2026. Removing weak performers
# FLATTERS this arm relative to a true 92-symbol result. The registered prior
# for this arm is failure; a bias that flatters it makes a failure result more
# convincing, not less. It would NOT be safe to read a success here as evidence.
#
# Everything else is byte-for-byte amat_v1.toml, including the 120-session
# covariance lookback -- deliberately not widened, so the estimation cost of a
# large universe is measured rather than compensated for.

name = "amat-etf-wide81"
version = "7.4.0"
