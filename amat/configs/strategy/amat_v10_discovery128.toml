# AMAT v10: broad-universe discovery control.
#
# This arm changes the tradable universe, not the signal. It is intentionally
# long-only/daily because that is the only execution and accounting contract the
# repository can currently simulate end-to-end. Its purpose is law-of-large-
# numbers diagnosis: the data snapshot contains 128 continuously covered
# instruments and 124 receive sleeve reports. RTX is data-only because its 2020
# corporate transformation cannot be reconciled by the current ledger. COP,
# DVN, and FANG are data-only because their fixed-plus-variable distributions
# collide in the provider's normalized cash-dividend field; summing or choosing
# one would be an unverified accounting decision. Weak
# families can be eliminated by a predeclared rule
# instead of hand-picking historical winners.
#
# NOT PROMOTED. The sample has already been inspected. Survival and delisting
# bias remain because continuous 2016 coverage is the inclusion rule.

name = "amat-discovery-defense-energy-124"
version = "10.0.2"

[[universe.clusters]]
name = "us_equity_broad"
gross_cap = 0.40
symbols = ["SPY", "VTI", "QQQ", "IWM", "IJH", "IJR", "MDY", "RSP"]

