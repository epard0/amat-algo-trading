symbols = ["LMT", "NOC", "GD", "LHX", "HII", "BA", "TXT", "LDOS", "CACI", "KTOS", "MRCY", "CW", "TDG", "HEI", "AVAV", "ITA", "XAR", "PPA"]

[[universe.clusters]]
name = "energy_companies"
gross_cap = 0.30
# COP, DVN, and FANG remain inspectable in the snapshot but are quarantined
# until their same-date fixed/variable dividend components are represented
# without inventing or discarding cash.
symbols = ["XOM", "CVX", "EOG", "OXY", "MPC", "VLO", "PSX", "SLB", "HAL", "KMI", "WMB", "LNG", "EQT", "APA", "OKE", "TRGP", "AR", "CNX", "OVV"]

