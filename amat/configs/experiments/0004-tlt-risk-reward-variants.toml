# Registered BEFORE any variant was run, per the registry rules.
# Motivated by the TLT sleeve audit finding (the only losing sleeve, -7.04%
# per 100k) and the standing v6-audit observation that the rates sleeve is
# structurally mismatched in this sample. The split date matches experiments
# 0001 and 0003 and never moves.

id = "0004-tlt-risk-reward-variants"
registered_at = 2026-08-15T06:45:00Z
hypothesis = """
Some reduction of the rates sleeve's risk budget -- excluding TLT, excluding
the whole rates cluster, or tightening the rates cluster's gross cap --
ranks above the frozen v1 configuration on training-window fold consistency
AND holds that advantage on the validation window the ranking never used.

Prior, stated in advance: EXPECTED TO FAIL the honesty bar even if it "wins".
TLT's loss is concentrated in the 2022 rates shock, which the training
window contains; a variant that removes TLT is therefore selecting against
a known historical episode, which is exactly the hindsight universe surgery
the v6 audit refused ("Removing rates after seeing this would be hindsight
universe selection"). The pre-registered reading: (a) if exclusion variants
win training but not validation, the frozen core stands, as with 0003;
(b) if a variant wins BOTH, it still earns only a registered new version
and the full protocol, with the hindsight-selection caveat attached
permanently -- the diversification an unloved sleeve provides is exactly
the property a 2016-2026 sample cannot price; (c) cluster-cap tightening is
the a-priori-preferred expression because it reduces rather than deletes.

Falsification: the frozen v1 row ranks first on training, or the training
winner's validation Sharpe does not exceed frozen v1's validation Sharpe.
"""
base_config = "configs/strategy/amat_v1.toml"
changes = [
  "variant A: universe without TLT (rates cluster becomes IEF-only; cap unchanged)",
  "variant B: universe without TLT and IEF (no rates cluster at all)",
  "variant C: rates cluster gross_cap 0.35 -> 0.20",
  "variant D: rates cluster gross_cap 0.35 -> 0.10",
  "control:  universe without IEF (the PROFITABLE rates sleeve removed; if this 'improves' similarly, the improvement is about deleting rates duration generally, not about TLT)",
]
sample = "snapshot alpaca-sip-2026-08-11, full window; training through 2022-12-30 (ranking only), validation 2023-01-02..2026-08-10 (measured for every variant, ranking-blind); $100,000; 2 bps one-way"
benchmarks = ["frozen amat_v1.toml under identical data, costs, funding, and split"]
status = "complete"

# Multiple-testing note, recorded at registration: 5 variants + baseline
# consume surprise capacity; the verdict must restate the count. Known bias:
# the whole history is burned, so even validation is only ranking-blind.
# The 2022 rates shock sits INSIDE the training window, which mechanically
# favors TLT-removal variants on training -- that is the trap the split is
# expected to expose, not a discovery.

