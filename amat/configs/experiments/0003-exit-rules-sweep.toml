id = "0003-exit-rules-sweep"
registered_at = 2026-08-13T18:55:00Z
hypothesis = """
Some explicit per-position exit overlay -- a stop-loss and/or take-profit on
the adjusted entry basis, with a fixed 21-session re-entry embargo -- ranks
above the frozen no-exit core on training-window fold consistency
(fold_score: 0.5*median + 0.5*minimum of four contiguous fold Sharpes) AND
holds that advantage on the validation window the ranking never used.

Prior, stated in advance: for a volatility-targeted long-or-cash trend
design the expectation is FAILURE. A stop realizes losses the position
sizing already sized for and interrupts exactly the multi-month trends the
signal exists to ride; a take-profit truncates the right tail that trend
following's positive skew depends on. The frozen core's exits (signal
deadband, volatility target, caps) are the null hypothesis.

Falsification: the no-exit row ranks first on training, or the training
winner's validation Sharpe does not exceed the no-exit row's validation
Sharpe. Either outcome keeps the frozen core; a surviving winner earns only
a NEW registered version and the full protocol, never an in-place change.
"""
base_config = "configs/strategy/amat_v1.toml"
changes = [
  "runner overlay only (amat.backtest.exits.ExitRules); the frozen configuration is untouched",
  "grid: stop_loss in {none, 5%, 10%, 15%} x take_profit in {none, 10%, 20%} = 12 combinations including the no-exit baseline",
  "re-entry embargo fixed at 21 sessions (the shortest signal horizon); breach basis is the adjusted price of the flat-to-long entry fill",
]
sample = "snapshot alpaca-sip-2026-08-11, full window; training through 2022-12-30 (ranking only), validation 2023-01-02..2026-08-10 (measured for every candidate, ranking-blind); $100,000; 2 bps one-way"
benchmarks = ["the no-exit (frozen v1) row under identical data, costs, funding, and split"]
status = "complete"

