# Reviewed event-to-asset taxonomy for news-driven universe discovery.
#
# This is deliberately small and explicit. Headlines never supply ticker
# symbols or instructions; they can only activate a theme whose US companies
# and vocabulary were reviewed here. Positive news makes these companies
# eligible for the strategy's normal trend/risk engine -- it does not force a
# trade and does not set a weight.

[[themes]]
name = "us_defense"
keywords = [
  "defense contract", "defence contract", "military contract", "pentagon",
  "department of defense", "military", "missile", "munitions", "weapons deal",
  "arms deal", "fighter jet", "naval contract", "defense spending",
]
symbols = ["LMT", "RTX", "NOC", "GD", "LHX", "HII", "BA"]
positive_terms = [
  "announces", "award", "awarded", "approves", "approved", "contract",
  "deal", "funding", "increase", "orders", "selected", "wins",
]
negative_terms = [
  "cancel", "cancelled", "cuts", "delay", "delayed", "loses", "probe",
  "rejected", "suspend", "suspended",
]

[[themes]]
name = "us_semiconductors"
