[project]
name = "kalshi-crypto-15m-bot"
version = "2.0.0"
requires-python = ">=3.13"
dependencies = [
    "httpx==0.28.1",
    "loguru==0.7.3",
    "python-dotenv==1.2.1",
    "kalshi-python-async==3.26.0",
    "urllib3>=2",
]

[project.optional-dependencies]
# Offline model fitting only. NEVER imported by bot.py; the trading host
# installs the runtime set alone, and model output crosses into production as
# a JSON artifact rather than as imported code.
research = [
    "numpy>=2",
    "scikit-learn>=1.5",
    "yfinance>=0.2.65",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.4.0",
    "ruff==0.15.5",
]
storefront = [
    "flask>=3.1.3",
    "gunicorn>=26.0.0",
    "mailtrap>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest-asyncio>=1.4.0",
]
