# Trading bot plus its observability stack.
#
# The bot and the monitoring server are separate services on purpose: the
# dashboard opens the ledger read-only, so it can be restarted, rebuilt, or
# crash without any effect on an open position.
#
# Every published port binds 127.0.0.1. The dashboard exposes full position and
# P&L history and Grafana ships with a default login, so binding 0.0.0.0 on a
# VPS with no host firewall would publish the account's trading record. Reach
# them over an SSH tunnel:
#
#   ssh -p 2222 -N -L 3000:127.0.0.1:3000 -L 8787:127.0.0.1:8787 <user>@<vps>
services:
  bot:
    build: .
    image: kalshi-crypto-15m-bot:local
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TRADE_LEDGER_PATH: /app/state/trade_ledger.db
      TRADE_LOG_PATH: /app/state/trades.jsonl
      DECISION_LOG_PATH: /app/state/decisions.jsonl
    volumes:
      - bot-state:/app/state
    stop_grace_period: 30s

  monitoring:
    build: .
    image: kalshi-crypto-15m-bot:local
    init: true
    restart: unless-stopped
    depends_on:
      - bot
    command:
      - python
      - -m
      - monitoring.server
      # 0.0.0.0 inside the container network only; the published port below is
      # still pinned to loopback on the host.
      - --host=0.0.0.0
      - --port=8787
      - --ledger=/app/state/trade_ledger.db
      - --decisions=/app/state/decisions.jsonl
      # Opens the dashboard on the live book. View-only: this server is
      # read-only and cannot place an order. Swap to --paper to default to the
      # paper book instead; both stay switchable in the UI either way.
      - --live
    volumes:
      - bot-state:/app/state:ro
    ports:
      - "127.0.0.1:8787:8787"

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    depends_on:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./grafana/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      # Change these before exposing Grafana beyond a tunnel.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/kalshi-bot.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  bot-state:
  prometheus-data:
  grafana-data:
