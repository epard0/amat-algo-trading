    <path d="M32 7 A25 25 0 1 0 57 32" stroke-width="7" opacity=".9" />
    <path d="M32 50 L32 14" stroke-width="4" opacity=".55" />
    <path d="M32 44 L32 22" stroke-width="13" />
  </g>
