<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-labelledby="kx15-favicon-title" width="64" height="64">
  <title id="kx15-favicon-title">KX15</title>
  <!--
    The 16px cut. Three candles turn to mush in a browser tab, so this variant
