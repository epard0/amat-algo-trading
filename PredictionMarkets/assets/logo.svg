<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-labelledby="kx15-title" width="64" height="64">
  <title id="kx15-title">KX15</title>
  <!--
    A dial with its first quarter missing, holding three candles.

    The gap is the fifteen minutes the bot trades. It is the only asymmetry in
    an otherwise regular shape, so it is what the eye keeps at small sizes; a
    closed ring would read as a generic circle.

    Three candles closing higher each time read as a price chart at a glance.
    They sit clear of the gap on purpose, so the silhouette stays legible.

    Everything is one green. A second colour would have to work on both a white
    page and a near-black one, and this mark ships as a plain img in places
    that cannot theme it - a README, a favicon, an email. Depth comes from
    opacity instead, which survives any background.

    64-unit grid, 4-unit strokes: edges land on whole device pixels at 16, 32
    and 64. For 16px use favicon.svg, which drops to a single candle.
  -->
  <g fill="none" stroke="#16a34a" stroke-linecap="round">
    <path d="M32 7 A25 25 0 1 0 57 32" stroke-width="5" opacity=".9" />
    <g stroke-width="3.5" opacity=".5">
      <path d="M21 41 L21 27" />
      <path d="M32 46 L32 21" />
      <path d="M43 37 L43 15" />
    </g>
    <g stroke-width="9">
      <path d="M21 38.5 L21 33.5" opacity=".45" />
      <path d="M32 42 L32 27" opacity=".75" />
      <path d="M43 32 L43 20" />
    </g>
  </g>
</svg>
