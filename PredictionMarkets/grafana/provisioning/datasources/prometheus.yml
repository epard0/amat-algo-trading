# Auto-provisioned Prometheus datasource.
# The dashboard's ${datasource} variable resolves to this at import time, which
# is why panels no longer need a hardcoded uid.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: kalshi-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST
