# Loads every dashboard JSON dropped into /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: kalshi-bot
    orgId: 1
    folder: Trading
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
