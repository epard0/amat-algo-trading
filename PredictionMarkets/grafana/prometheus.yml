# Prometheus scrape config for the bot's monitoring exporter.
#
# The exporter recomputes everything from the ledger on each scrape, so the
# interval is a cost/freshness tradeoff, not a data-loss risk: a missed scrape
# loses a sample, never a trade. 30s is well inside a 15-minute market.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    service: kalshi-15m-bot

scrape_configs:
  - job_name: kalshi-bot
    metrics_path: /metrics
    static_configs:
      - targets: ["monitoring:8787"]
        labels:
          instance: kalshi-bot
